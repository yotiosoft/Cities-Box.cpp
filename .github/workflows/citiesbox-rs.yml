name: citiesbox-rs CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: citiesbox-rs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Rust tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: src/citiesbox-rs

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable

      - name: Prepare save file fixtures
        working-directory: .
        env:
          MAP_DIR: Windows/Cities-Box.cpp/Cities-Box.cpp/App/data/maps
          FIXTURE_DIR: Mac/Cities-Box/App/Cities-Box.app/Contents/Resources/assets/data/maps
        run: |
          mkdir -p "$MAP_DIR"
          cp "$FIXTURE_DIR/Sample_City.cbd.cbj" "$MAP_DIR/Sample_City.cbd.cbj"
          cp "$FIXTURE_DIR/Sample_City.cbd.cbj" "$MAP_DIR/backup.cbj"
          cp "$FIXTURE_DIR/Sample_City.cbd.cbj.cbj" "$MAP_DIR/Sample_City.cbd.cbj.cbj"

      - name: Run citiesbox-rs tests
        run: cargo test --locked
